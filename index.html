<!DOCTYPE html>

<head>
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded" rel="stylesheet">
  <link href="styles/style.css" rel="stylesheet">
  <script src="scripts/bundle.js"></script>
</head>

<body>
  <h1 class="md-typescale-headline-medium">Quadruped Robot Controller</h1>
  <div class="container">
    <div class="controllers">
      <div class="angle-controllers">
        <div class="angle-controller">
          <md-elevation></md-elevation>
          <h3>Front left</h3>
          <md-slider></md-slider>
          <md-slider></md-slider>
          <md-slider></md-slider>
        </div>
        <div class="angle-controller">
          <md-elevation></md-elevation>
          <h3>Back left</h3>
          <md-slider></md-slider>
          <md-slider></md-slider>
          <md-slider></md-slider>
        </div>
        <div class="angle-controller">
          <md-elevation></md-elevation>
          <h3>Front right</h3>
          <md-slider></md-slider>
          <md-slider></md-slider>
          <md-slider></md-slider>
        </div>
        <div class="angle-controller">
          <md-elevation></md-elevation>
          <h3>Back right</h3>
          <md-slider></md-slider>
          <md-slider></md-slider>
          <md-slider></md-slider>
        </div>
      </div>
      <div class="pos-orn-controllers">
        <div class="pos-orn-controller">
          <md-elevation></md-elevation>
          <div class="icon-slider">
            <md-icon>open_in_full</md-icon>
            <md-slider></md-slider>
          </div>
          <div class="icon-slider">
            <md-icon>height</md-icon>
            <md-slider></md-slider>
          </div>
          <div class="icon-slider">
            <md-icon>arrow_range</md-icon>
            <md-slider></md-slider>
          </div>
        </div>
        <div class="pos-orn-controller">
          <md-elevation></md-elevation>
          <div class="icon-slider">
            <md-icon style="transform: scaleX(0.5)">refresh</md-icon>
            <md-slider></md-slider>
          </div>
          <div class="icon-slider">
            <md-icon>refresh</md-icon>
            <md-slider></md-slider>
          </div>
          <div class="icon-slider">
            <md-icon>360</md-icon>
            <md-slider></md-slider>
          </div>
        </div>
      </div>
    </div>
    <div class="legs-view">
      <md-elevation></md-elevation>
      <div class="leg-view">
        <div class="leg"><div></div><div></div></div>
      </div>
      <div class="leg-view">
        <div class="leg"><div></div><div></div></div>
      </div>
      <div class="leg-view">
        <div class="leg"><div></div><div></div></div>
      </div>
      <div class="leg-view">
        <div class="leg"><div></div><div></div></div>
      </div>
    </div>
  </div>
</body>
